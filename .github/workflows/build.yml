# pe_ports CI: every port built in the shared autobleem-build image (ci/build.sh all), one PE package (.mod) and one
# source archive per port. A v* tag publishes them as a release; develop keeps the rolling `nightly` pre-release
# current. Gated by AB_CI_ENABLED, like every autobleem2 repository - it runs once this repository exists on GitHub.
#
# The build runs through `docker run` (not a container job) so the image's digest can be written into the source
# archives: a container job does not tell its steps which digest it runs.
name: build
on:
  push:
    branches: [develop, master]
    tags: ['v*']
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
defaults:
  run:
    shell: bash
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: vars.AB_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: "Workflow files are valid YAML (a broken one starts no run at all)"
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python3" -m pip install --quiet pyyaml pytest
          "$RUNNER_TEMP/venv/bin/python3" -m pytest -q tests/test_workflows.py
      - name: Cache the build dependencies that are not in git
        uses: actions/cache@v4
        with:
          path: build_data
          key: pe-ports-data-${{ hashFiles('ports/*/build.sh') }}
      - name: The build image
        run: |
          tag=$([[ "$GITHUB_REF" == refs/tags/v* ]] && echo latest || echo develop)
          image=ghcr.io/autobleem2/autobleem-build:$tag
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$image"
          echo "AB_BUILD_IMAGE=$image" >> "$GITHUB_ENV"
          echo "AB_BUILD_IMAGE_DIGEST=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}' | sed 's/.*@//')" >> "$GITHUB_ENV"
      - name: "Build every port (the console, then the Raspberry Pi 32-bit and 64-bit and the PC stick: the engines again, the game data is shared)"
        run: |
          for target in psc rpi rpi64 pcusb; do
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/src" -w /src -e HOME=/tmp \
              -e AB_BUILD_IMAGE -e AB_BUILD_IMAGE_DIGEST "$AB_BUILD_IMAGE" ci/build.sh --target "$target" all
          done
      - name: Every package comes with its source archive
        run: |
          ls -l out
          n=0
          for m in out/*.mod; do
            # <id>-<version>.mod (the console) and <id>-<version>-<rpi|rpi64|pcusb>.mod share one source archive
            src=${m%.mod}; src=${src%-rpi}; src=${src%-rpi64}; src=${src%-pcusb}
            [ -f "$src-source.tar.gz" ] || { echo "no source archive for $m" >&2; exit 1; }
            n=$((n+1))
          done
          [ "$n" -ge 1 ] || { echo "no packages built" >&2; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: pe-ports-packages
          path: out/*
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { name: pe-ports-packages, path: out }
      - name: Attach to the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          prerelease=""; case "${GITHUB_REF_NAME}" in *-alpha*|*-beta*|*-rc*|*-pre*) prerelease="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "PE ports ${GITHUB_REF_NAME}" --generate-notes $prerelease out/* || \
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" out/* --clobber

  nightly:
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { name: pe-ports-packages, path: out }
      - uses: autobleem2/autobleem-build/.github/actions/nightly-release@develop
        with:
          files: out/*

  # the download site (a v* release only - nightlies stay GitHub pre-release assets): the source archives go to
  # source/<id>/ (the address each package's SOURCE.txt names; kept at least 3 years after the item's last release),
  # then the .mod, its icon and its `pe` item descriptor (tools/store_item.py) to the Store's PSC catalog, store/psc/
  # (and the engines of the Raspberry Pi 32-bit, <id>-<version>-rpi.mod, of the Raspberry Pi 64-bit, -rpi64.mod, and of the
  # PC stick, -pcusb.mod, each with the same game-data packages, to store/rpi/, store/rpi64/ and store/pcusb/);
  # the site's index run lists them in the catalog and on the Store page. All of it or nothing: store_item.py stops
  # when a port's package or source is missing, and it runs before anything is published. On the psc-build runner,
  # where the site's tree is, in the build image: the way ext_store's `site` job publishes. The publish tools come
  # from autobleem-repo's develop (its page generator is three-way merged with the site's copy).
  site:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: [self-hosted, psc-build]
    env:
      AB_REPO_DIR: /home/claude/autobleem-repo
    steps:
      - uses: actions/checkout@v7
        with:
          repository: autobleem2/autobleem-repo
          ref: develop
          path: autobleem-repo-tools
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          path: pe-ports # ports/ and tools/store_item.py
      - uses: actions/download-artifact@v8
        with: { name: pe-ports-packages, path: out }
      - name: The Store items (all or nothing)
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD/pe-ports" ghcr.io/autobleem2/autobleem-build:latest \
            sh -c 'python3 tools/store_item.py --out "$1/out" --dest "$1/store-out" &&
                   for t in rpi rpi64 pcusb; do
                     python3 tools/store_item.py --target "$t" --out "$1/out" --dest "$1/store-out-$t" || exit 1
                   done' sh "$PWD"
      - name: Publish the source archives and the Store items to the download site
        run: |
          set -euo pipefail
          ls -l out store-out
          for d in pe-ports/ports/*/; do
            id=$(basename "$d")
            # a data port (a [package] section: a game's files as a package zip) has no program, so no source archive
            if grep -q '^\[package\]' "$d/port.ini"; then continue; fi
            set -- "$PWD"/out/"$id"-*-source.tar.gz
            [ -f "$1" ] || { echo "no source archive for $id in this release" >&2; exit 1; }
            docker run --rm \
              -v "$PWD:$PWD" -w "$PWD/autobleem-repo-tools" -v "$AB_REPO_DIR:$AB_REPO_DIR" -e REPO_DIR="$AB_REPO_DIR" \
              -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
              ghcr.io/autobleem2/autobleem-build:latest \
              bash tools/repo_publish.sh --local pe-source "$id" "$@"
          done
          docker run --rm \
            -v "$PWD:$PWD" -w "$PWD/autobleem-repo-tools" -v "$AB_REPO_DIR:$AB_REPO_DIR" -e REPO_DIR="$AB_REPO_DIR" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/autobleem2/autobleem-build:latest \
            bash tools/repo_publish.sh --local store psc "$PWD"/store-out/*
          # the catalogs of the Raspberry Pi 32-bit, the Raspberry Pi 64-bit and the PC stick: their engines and the same
          # game-data packages
          for t in rpi rpi64 pcusb; do
            docker run --rm \
              -v "$PWD:$PWD" -w "$PWD/autobleem-repo-tools" -v "$AB_REPO_DIR:$AB_REPO_DIR" -e REPO_DIR="$AB_REPO_DIR" \
              -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
              ghcr.io/autobleem2/autobleem-build:latest \
              bash tools/repo_publish.sh --local store "$t" "$PWD"/store-out-"$t"/*
          done
