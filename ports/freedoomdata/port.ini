; Freedoom's game files for the PlayStation Classic, as a PE package: the IWADs the lzdoom package plays. It has no
; program (kind=data): its launcher folder is where lzdoom finds freedoom1.wad and freedoom2.wad
; (ports/lzdoom/files/psc-pad.sh). The generator is tools/mkmod.py (README.md, "port.ini").
[port]
id=freedoomdata
name=Freedoom data
version=0.13.0-1
kind=data
category=other
xz_preset=0
description=The free game data of Freedoom 0.13.0 - Phase 1 (freedoom1.wad, the Ultimate Doom replacement) and Phase 2 (freedoom2.wad, the Doom II replacement) - for the LZDoom (Freedoom) App. This package only holds the files: install it, then start LZDoom (Freedoom). It is about 58 MB.
licence=BSD-3-Clause
licence_files=COPYING.txt CREDITS.txt CREDITS-MUSIC.txt
upstream_url=https://github.com/freedoom/freedoom/releases/download/v0.13.0/freedoom-0.13.0.zip
upstream_commit=3f9b264f3e3ce503b4fb7f6bdcb1f419d93c7b546f4df3e874dd878db9688f59
upstream_note=the SHA-256 of freedoom-0.13.0.zip, the release archive of 29 January 2024; the game files are built by the Freedoom project (github.com/freedoom/freedoom) and released as this archive, which is not pulled in as a submodule here
icon_text=FREEDOOM|DATA
publisher=The Freedoom project
year=2024
copyright=Copyright (c) 2001-2024 Contributors to the Freedoom project (CREDITS.txt lists them, CREDITS-MUSIC.txt credits the music); released under the modified BSD licence in COPYING.txt
changes=only these files of the release archive are packed, byte for byte: freedoom1.wad, freedoom2.wad, with COPYING.txt, CREDITS.txt and CREDITS-MUSIC.txt in licences/ (not packed: the manuals, NEWS and README pages); the archive is fetched at build time from autobleem.retromenele.pl/mirror/freedoom/ with the Freedoom GitHub release as the fallback, pinned by its sha256; ports/freedoomdata/files/freedoomdata.sh: a notice script, the package has nothing to run

[launcher]
filename=freedoomdata
binary=freedoomdata.sh
args=
env=

[pad]
PadMode=psc-kernel
Dpad2Analog=0
Analog2Dpad=1
note=none - the package has nothing to run, so it needs no pad settings (the pad flags are the launcher's pe_compat.ini section of the same name, and it needs none)

[data]
shipped=Freedoom 0.13.0 freedoom1.wad and freedoom2.wad (two WAD files, about 58 MB)
shipped_note=freedoom1.wad and freedoom2.wad are the Freedoom 0.13.0 release's game files as released, unmodified, with the release's COPYING.txt (modified BSD licence), CREDITS.txt and CREDITS-MUSIC.txt in licences/. They are free content made by the Freedoom project, not id Software's Doom data.
