; OpenJazz for the PlayStation Classic, as a PE package. The generator is tools/mkmod.py (README.md, "port.ini").
[port]
id=openjazz
name=OpenJazz
version=20200321-2
description=A free, open-source version of the classic Jazz Jackrabbit games. The package carries the shareware episodes of Jazz Jackrabbit (Epic MegaGames, with its licence file); the full game's files can be added to the gamedata folder.
licence=GPL-2.0-or-later
licence_files=COPYING licenses.txt
upstream_url=https://gitlab.com/modmyclassic/ports/openjazz-sdl2
upstream_commit=4a1d6e0bfee52f080adc4b582531369306f0cc87
upstream_note=21 March 2020: OpenJazz with the SDL2 and console changes the 2020 port was made from; its classic/ folder (the 2020 packaging) is left out of the build and the source archive
export_exclude=classic .gitlab-ci.yml
icon_text=OPEN|JAZZ
publisher=Alister Thomson
year=1994
copyright=Copyright (c) 2005-2019 Alister Thomson; menu plasma effect Copyright (c) 2010 Alireza Nejati; the bundled miniz, psmplug and scale2x keep their own notices (licenses.txt)
changes=patches/0001-one-fullscreen-window.patch: one full-screen window and renderer for the whole run (the 2020 tree made a second window over the first at start-up, which left the console's screen black); otherwise the 2020 tree as it is (the pinned commit already holds the SDL2 port and Makefile.psc); the build uses Makefile.psc with the console's compiler flags

[launcher]
filename=openjazz
binary=OpenJazz
args=-f "$(pwd)/gamedata"
env=HOME=/var/volatile/launchtmp

[pad]
PadMode=psc-kernel
Dpad2Analog=0
Analog2Dpad=1
note=OpenJazz reads SDL joystick buttons and axes (SDL_JoystickOpen(0))

[data]
shipped=Jazz Jackrabbit shareware (gamedata/, 75 files with LICENSE.DOC)
shipped_note=gamedata/ is the shareware version of Jazz Jackrabbit (Epic MegaGames) exactly as released, with LICENSE.DOC, VENDOR.DOC and ORDER.DOC; it stays Epic MegaGames' and may be spread only complete and unmodified.
