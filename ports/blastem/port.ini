; BlastEm (a Sega Mega Drive / Genesis emulator) for the PlayStation Classic, as a PE package. The generator is tools/mkmod.py
; (README.md, "port.ini"). No game is part of the package: the player puts his own ROMs in its roms folder.
[port]
id=blastem
name=BlastEm
version=1.0.0-1
category=games
description=BlastEm is an accurate emulator of the Sega Mega Drive / Genesis (also Master System, Game Gear, SG-1000, Sega CD and 32X). It runs the games you own: put their ROM files (homebrew too) in this App's roms folder and start the App. No game is included and none is downloaded. It draws with OpenGL ES 2 through the console's own SDL; its menu (L2 or R2 in a game) has the settings, save states, reset and exit. The console's pad: d-pad, Cross, Circle and Square are A, B and C, Triangle, L1 and R1 are X, Y and Z (6 button games), Start is Start and Select is Mode. Speed depends on the game and the settings: the 68000 runs in BlastEm's portable core (its recompiler is for PCs only), so heavy games and the Sega CD and 32X may be slow.
licence=GPL-3.0-or-later
licence_files=COPYING zlib/LICENSE
upstream_url=https://www.retrodev.com/repos/blastem
upstream_commit=2b2a182f45226deb055979659ca844d63c49b462
upstream_note=the Mercurial tag v1.0.0 (changeset 2b2a182f4522); the source in ports/blastem/upstream is the tag's own export (https://www.retrodev.com/repos/blastem/archive/v1.0.0.tar.gz, sha256 ad35793e3e6d8f3a23914aecc2b28fe3aeb13ab9416d7d9ecbeba2781a755ceb) without its android/ folder, byte for byte otherwise (.gitattributes keeps it so)
icon_text=BLASTEM|MEGA DRIVE
publisher=Michael Pavone
year=2013
copyright=Copyright (c) 2010-2026 Michael Pavone, GPL v3 or later (the file COPYING); built in: Nuklear (public domain; its default font ProggyClean, Copyright (c) 2004, 2005 Tristan Grimmer, MIT licence), zlib (zlib licence, zlib/LICENSE) and any other third party code with its notice in the source; SDL_GameControllerDB (zlib licence); the launcher's own SDL2 (zlib licence) is used, not shipped
changes=ports/blastem/patches/0001-psc-pad-mapping.patch: the console's pad (ten buttons, d-pad on axes 0 and 1) gets an SDL game controller mapping by its shape, so BlastEm's own pad bindings reach it (the 2020 package changed the same part of the program for the same pad); ports/blastem/patches/0002-psc-defaults.patch: default.cfg gets the console pad's bindings (Cross, Circle, Square = A, B, C; Triangle, L1, R1 = X, Y, Z; L2 and R2 open the menu), full screen on and the ROM browser opening in the App's roms folder; ports/blastem/patches/0003-psc-default-font.patch: the menu uses Nuklear's own built-in font when the system has none (the console has no fontconfig or fonts); ports/blastem/files: the start-up script (psc-setup.sh makes the roms and settings folders) and the note for the roms folder; built with the upstream Makefile for hard-float ARM against the console's sysroot (the portable 68000 and Z80 cores generated by the upstream's cpu_dsl.py, OpenGL ES 2 through SDL2, the bundled zlib, no GTK, no GLEW); the upstream's android/ folder is not part of the source here

[launcher]
filename=blastem
binary=blastem
pre=. ./psc-setup.sh
env=HOME=/var/volatile/launchtmp LD_LIBRARY_PATH="${PROJECT_ERIS_PATH}/lib:${LD_LIBRARY_PATH}:/var/volatile/launchtmp/lib"

[pad]
PadMode=psc-kernel
Dpad2Analog=0
Analog2Dpad=1
note=like every port: the console's own pad (psc-kernel). BlastEm reads it through SDL's game controller layer: patches/0001-psc-pad-mapping.patch adds the mapping (buttons 0..9 = Triangle, Circle, Cross, Square, L2, R2, L1, R1, Select, Start; axes 0/1 = the d-pad as half-axis buttons), patches/0002-psc-defaults.patch binds it.

[data]
shipped=none
shipped_note=none - BlastEm is an emulator: no game, BIOS or other data is packaged or downloaded (it needs no BIOS; the Sega CD would need the player's own). The player's games go in the roms folder of the App (roms/README.txt).
