[port]
id=xargon
name=Xargon
version=3.0-3
description=Xargon (1994): the Xargon trilogy, three platform episodes with a guided laser, hidden rooms and a map to travel. Freeware since its author's 2008 release; shipped unchanged. Runs in DOSBox.
licence=Freeware (Allen Pilgrim, released 2008)
publisher=Allen Pilgrim (Epic MegaGames)
year=1994
icon_text=XARGON

[package]
content_kind=dos-game
games=xargon|Xargon (Trilogy)|XARGON/XARGON.BAT
start=XARGON/XARGON.BAT|Play;XARGON/HELPME.EXE|Instructions
mapper=mapper.txt
dosbox.cycles=max
dosbox.memsize=16
dosbox.sound=sb16

[pad]
note=files/mapper.txt (the game's own pad map, DOSBox's mapper; the keys are the ones Xargon's own help lists): the d-pad is the arrows (move, duck, aim the laser, up = through a door), Cross Space (fire), Square left Shift (fire), Circle left Alt (jump), Triangle Enter (inventory), Start Escape, Select P (pause), L1 S (save), R1 L (load), L2 B (buy), R2 Y (yes)

