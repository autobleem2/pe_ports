; OpenArena's game data for the PlayStation Classic, as a PE package that proc_pe turns into a game-data package
; (Packages/pe-openarenadata/, never an App): the files the q3-openarena engines play (ioquake3, through the
; launcher's "Choose game data"; AB_PKG_DIR is fs_basepath, ports/ioquake3/files/psc-pad.sh). It has no program
; (kind=data) and no launch.sh: [datapackage] is its package.ini. The generator is tools/mkmod.py (README.md, "port.ini").
[port]
id=openarenadata
name=OpenArena data
version=0.8.8-2
kind=data
category=other
xz_preset=0
description=The free game data of OpenArena 0.8.8 - maps, player models, textures, sounds and music - for the ioquake3 (OpenArena) App. This is game data, not an App: it shows in the Packages row, and ioquake3 (OpenArena) lets you choose it. It is about 380 MB.
licence=GPL-2.0-only
licence_files=COPYING CREDITS README readme_088.txt
upstream_url=http://download.tuxfamily.org/openarena/rel/088/openarena-0.8.8.zip
upstream_commit=5a8faf7f5b51f351b0a1618c06b6b98a5f1a6758f1d39818de2c87df2a0bac4a
upstream_note=the SHA-256 of openarena-0.8.8.zip, the release archive of 23 January 2012; OpenArena is not kept in git
icon_text=OPENARENA|DATA
publisher=The OpenArena team
year=2012
copyright=Copyright (C) the OpenArena contributors (CREDITS lists them); id Software's Quake III Arena source code is the base of the engine, not of this data; maps converted from earlier id Software games were released under the GPL v2 by John Romero; the data's own readme states that the program and the data are licensed under the GNU GPL v2
changes=only these files of the release archive are packed, byte for byte: baseoa/pak0.pk3, pak1-maps.pk3, pak2-players.pk3, pak4-textures.pk3, pak5-TA.pk3, pak6-misc.pk3, pak6-patch085.pk3, pak6-patch088.pk3 (not packed: pak2-players-mature.pk3, the missionpack, the engines and libraries for other systems); the archive is fetched at build time from autobleem.retromenele.pl/deps/openarena/ with the OpenArena download site as the fallback, pinned by its sha256; the package.ini that names the game (kind q3-openarena) is generated by tools/mkmod.py; the package has nothing to run

[datapackage]
content_kind=q3-openarena
games=openarena|OpenArena|baseoa/pak0.pk3
description=The free game data of OpenArena 0.8.8: maps, player models, textures, sounds and music, for Quake III engines.

[launcher]
filename=openarenadata

[pad]
PadMode=psc-kernel
Dpad2Analog=0
Analog2Dpad=1
note=none - the package has nothing to run, so it needs no pad settings (the pad flags are the launcher's pe_compat.ini section of the same name, and it needs none)

[data]
shipped=OpenArena 0.8.8 baseoa data (eight pk3 files, about 383 MB)
shipped_note=baseoa/*.pk3 are the OpenArena 0.8.8 release's game data as released (pak0, pak1-maps, pak2-players, pak4-textures, pak5-TA, pak6-misc, pak6-patch085, pak6-patch088), unmodified, with the release's COPYING (GPL v2), CREDITS and readme files in licences/. The release's readme says the media are under the GPL v2 and that their source can be had from the OpenArena site; the packed files are the pk3 archives of those media. Individual assets may carry their own credits (see CREDITS).
