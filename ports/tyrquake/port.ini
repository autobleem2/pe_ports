; TyrQuake for the PlayStation Classic, as a PE package. The generator is tools/mkmod.py (README.md, "port.ini").
[port]
id=tyrquake
name=TyrQuake
version=0.66-3
description=A Quake engine that looks like the Quake of old and runs on current systems. The package carries the first episode of Quake (the id Software shareware version); add the full game's pak1.pak to .tyrquake/id1 to play the rest.
licence=GPL-2.0-or-later
licence_files=gnu.txt
upstream_url=git://disenchant.net/tyrquake (https://disenchant.net/git/tyrquake.git)
upstream_commit=1afa470410971326d0af12c32bc2e7da0b764502
upstream_note=tag v0.66 of 3 December 2019
icon_text=TYR|QUAKE
publisher=Kevin Shanahan (Tyrann), id Software
year=1996
copyright=Copyright (C) 1996-1997 Id Software, Inc.; Copyright (C) 1999-2019 Kevin Shanahan (Tyrann) and contributors; the other files carry their own notices in the source
changes=patches/0001-psc-video-1280x720-abgr.patch: the console's window is 1280x720 and its pixel format ABGR8888 (the 2020 port's change); patches/0002-sdl-gamecontroller.patch: SDL game controller support for the pad (keys, analog sticks, menu navigation, -gamecontrollerdb), the 2020 port's change from its published source, with the button keys counted as keys.h has them (15, not the SDL header's SDL_CONTROLLER_BUTTON_MAX) and any key outside the key tables dropped; ports/tyrquake/files: the pad's key bindings, the controller database, the pad choice picture and the 1280x720 full-screen settings

[launcher]
filename=tyrquake
binary=tyr-quake
args=-gamecontrollerdb gamecontrollerdb.txt -width 1280 -height 720
pre="${PROJECT_ERIS_PATH}/bin/sdl_input_text_display" " " 0 0 12 "/usr/share/fonts/ttf/LiberationMono-Regular.ttf" 0 0 0 "$(pwd)/quake_controller_select.png" XO|SELECTEDOPTION=$?|if [ "${SELECTEDOPTION}" = "100" ]; then LEFTKEY="+left"; RIGHTKEY="+right"; elif [ "${SELECTEDOPTION}" = "101" ]; then LEFTKEY="+moveleft"; RIGHTKEY="+moveright"; else echo "[ERROR] Couldn't detect controller selection result. RESULT CODE: ${SELECTEDOPTION}" > "${RUNTIME_LOG_PATH}/tyrquake.log"; echo -n 1 > "/data/power/disable"; exit 1; fi|sed -i -e "s/bind \"GCLEFT\" \"[^\"]*\"/bind \"GCLEFT\" \"${LEFTKEY}\"/" -e "s/bind \"GCRIGHT\" \"[^\"]*\"/bind \"GCRIGHT\" \"${RIGHTKEY}\"/" ".tyrquake/id1/config.cfg"
env=HOME=/var/volatile/launchtmp

[pad]
PadMode=psc-kernel
Dpad2Analog=0
Analog2Dpad=1
note=the engine reads the console pad as an SDL game controller (gamecontrollerdb.txt, patches/0002-sdl-gamecontroller.patch); launch.sh asks first whether the pad has only a d-pad (X: left/right turn) or analog sticks (O: left/right strafe, right stick looks)

[data]
shipped=Quake shareware v1.06 (id1/pak0.pak) and its text files
shipped_note=.tyrquake/id1/pak0.pak is Quake's shareware episode, quake-shareware/ holds the texts that came with it (SLICNSE.TXT the shareware licence, LICINFO.TXT, README.TXT, ORDER.TXT, HELP.TXT), from id Software's quake106.zip, unmodified. It stays id Software's: you may not sell it or use it commercially.
