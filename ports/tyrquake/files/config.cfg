// the console pad (patches/0002-sdl-pad-input.patch): buttons 0..8 are AUX1..AUX9, the d-pad / left stick
// left, right, up, down are AUX11..AUX14; Start is Escape (the menu)
bind "AUX1" "impulse 10"
bind "AUX2" "+jump"
bind "AUX3" "+attack"
bind "AUX4" "impulse 12"
bind "AUX5" "+jump"
bind "AUX6" "+attack"
bind "AUX7" "+moveleft"
bind "AUX8" "+moveright"
bind "AUX9" "centerview"
bind "AUX11" "+left"
bind "AUX12" "+right"
bind "AUX13" "+forward"
bind "AUX14" "+back"
cl_run "1"
gamma "0.8"
volume "0.7"
viewsize "100"
