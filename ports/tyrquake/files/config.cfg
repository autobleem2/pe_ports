// the console pad as an SDL game controller (patches/0002-sdl-gamecontroller.patch, gamecontrollerdb.txt): the 2020 mapping
// Cross centre view, Square look down, Triangle look up, Circle strafe, Select free look, Start menu, L1/R1 weapon
// previous/next, L2 jump, R2 fire, the d-pad moves; launch.sh sets GCLEFT/GCRIGHT from the pad choice (turn or strafe)
unbindall
bind "TAB" "+showscores"
bind "PAUSE" "pause"
bind "+" "sizeup"
bind "-" "sizedown"
bind "0" "impulse 0"
bind "1" "impulse 1"
bind "2" "impulse 2"
bind "3" "impulse 3"
bind "4" "impulse 4"
bind "5" "impulse 5"
bind "6" "impulse 6"
bind "7" "impulse 7"
bind "8" "impulse 8"
bind "=" "sizeup"
bind "`" "toggleconsole"
bind "t" "messagemode"
bind "~" "toggleconsole"
bind "F1" "help"
bind "F2" "menu_save"
bind "F3" "menu_load"
bind "F4" "menu_options"
bind "F5" "menu_multiplayer"
bind "F6" "echo Quicksaving...; wait; save quick"
bind "F9" "echo Quickloading...; wait; load quick"
bind "F10" "quit"
bind "F11" "zoom_in"
bind "F12" "screenshot"
bind "AUX7" "togglemenu"
bind "GCA" "centerview"
bind "GBC" "+strafe"
bind "GCX" "+lookdown"
bind "GXY" "+lookup"
bind "GCBACK" "+klook"
bind "GCSTART" "togglemenu"
bind "GCRIGHTSTICK" "centerview"
bind "GCLEFTSHOULDER" "impulse 12"
bind "GCRIGHTSHOULDER" "impulse 10"
bind "GCUP" "+forward"
bind "GCDOWN" "+back"
bind "GCLEFT" "+moveleft"
bind "GCRIGHT" "+moveright"
bind "GCLEFTTRIGGER" "+jump"
bind "GCRIGHTTRIGGER" "+attack"
