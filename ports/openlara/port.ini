; OpenLara for the PlayStation Classic, as a PE package. The generator is tools/mkmod.py (README.md, "port.ini").
[port]
id=openlara
name=OpenLara
version=0.9.0-3
description=Classic Tomb Raider engine: a re-implementation of the first Tomb Raider's engine with widescreen, enhanced lighting and more. You need the PlayStation version of Tomb Raider (levels, audio) from your own copy.
licence=BSD-2-Clause
category=games
licence_files=LICENSE
upstream_url=https://github.com/XProger/OpenLara
upstream_commit=eacedfca94df478250131de3556d429788f509a9
upstream_note=2 March 2020, the commit the 2020 port was made from
icon_text=OPEN|LARA
publisher=XProger
year=2018
copyright=Copyright (c) 2018, Timur "XProger" Gagiev; stb_vorbis (public domain, Sean Barrett), minimp3 (CC0, lieff), tinf (zlib licence, Joergen Ibsen) in libs/
changes=patches/0001-psc-no-discard-framebuffer.patch: the console's EGL has no glDiscardFramebufferEXT; the build uses the upstream PlayStation Classic target (src/platform/psc) with the console's compiler flags
changes.rpi=the Raspberry Pi package is built from upstream's SDL2 and OpenGL ES 2 platform (src/platform/sdl2) instead of the console's own (src/platform/psc: wayland-egl and raw evdev input, which need the console's compositor); the pad reaches it through SDL's game controller layer; patches/0002-sdl2-log-errors.rpi.patch: the SDL2 platform logs SDL_GetError when SDL_Init, the window, the GL context or the renderer fail (it ignored them); the launch script shows a text screen and does not start the engine when the Tomb Raider game data is not in the App folder (the engine would end at once without a word)

[launcher]
; launcher_filename: also the key of this program in the launcher's compatibility list (rc/pe_compat.ini)
filename=openlara
binary=OpenLara
args=
; the SDL2 platform keeps its cache and saves under $HOME/.openlara/ (the console's platform used the program's own folder)
env.rpi=HOME=/var/volatile/launchtmp
; the engine ends at once, saying nothing, when none of the Tomb Raider files is there: the Pi shows the text dialog first (sdl_text_display, left on screen 10 seconds) and does not start the engine
pre.rpi=if [ ! -e PSXDATA/GYM.PSX ] && [ ! -e DATA/GYM.PHD ] && [ ! -e GYM.PHD ] && [ ! -e DATA/GYM.SAT ] && [ ! -e level/1/TITLE.PSX ] && [ ! -e level/1/TITLE.PHD ]; then "${PROJECT_ERIS_PATH}/bin/sdl_text_display" "OpenLara needs the game data of Tomb Raider (PlayStation).\nCopy its PSXDATA, DELDATA and FMV folders and the audio folder into the App folder (Apps/pe-openlara on the stick), then start OpenLara again." 640 120 12 none 255 255 255 ""; sleep 10; kill "$(cat "${PE_RUN_DIR}/sdl_display.pid" 2>/dev/null)" 2>/dev/null; echo "OpenLara: no Tomb Raider game data in the App folder" > "${RUNTIME_LOG_PATH}/openlara.log"; echo -n 1 > "/data/power/disable" 2>/dev/null; exit 1; fi

[pad]
; what the launcher's compatibility list should say for this program (README.md, "The pad")
PadMode=psc-kernel
Dpad2Analog=0
Analog2Dpad=1
note=OpenLara opens /dev/input/event* itself (libudev, no SDL) and reads the console pad's ABS_X/ABS_Y and BTN_A..BTN_TR2

[data]
shipped=none
user_note=Put the Tomb Raider (PlayStation) data in the App folder: the DELDATA, FMV and PSXDATA folders and the audio folder.
