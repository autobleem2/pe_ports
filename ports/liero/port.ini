game_folder=LIERO
licence_note=Liero is (c) 1998, 1999 Metsanelaimet (Joosa Riekkinen) and freeware: it may be distributed to anyone and anyhow WITHOUT ANY CHANGES MADE TO ITS CONTAINMENTS (licences/Liero-1.33-licence.txt, the author's page https://www.liero.be/licenses/133/license.txt - the game's files here are the author's archive unchanged, nothing was added to them or taken out); the archive's own LICENSE.TXT adds that the original data and binaries are also available under the WTFPL, that LIERO.EXE contains the SMIX sound library (BSD-3-Clause) and that LIERO.SND has sounds from Molez (freeware)
