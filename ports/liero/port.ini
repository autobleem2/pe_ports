; Liero for the PlayStation Classic, as a DOS game package for DOSBox (packages spec, 2.3). The generator is
; tools/mkmod.py (README.md, "port.ini", "Data ports"). A data port has no [launcher]: it is a package, not an App.
[port]
id=liero
name=Liero
version=1.33-1
description=Liero 1.33 (1998), the two-worm shoot-em-up: 40 weapons, a ninja rope, a level editor. Freeware, shipped unchanged exactly as the author's site hands it out. Runs in DOSBox.
licence=Freeware (Joosa Riekkinen): spread only without changes
publisher=Joosa Riekkinen
year=1998
icon_text=LIERO

[package]
content_kind=dos-game
games=liero|Liero|LIERO/LIERO.EXE
start=LIERO/LIERO.EXE|Play;LIERO/LEVEDIT.EXE|Level editor
mapper=mapper.txt
dosbox.cycles=max
dosbox.memsize=16
dosbox.sound=sb16

[pad]
note=files/mapper.txt (the game's own pad map, DOSBox's mapper): the d-pad is the arrows (menus, player 2's keys) AND R/F/D/G (player 1: aim up/down, move left/right), Square left Ctrl (fire), Cross left Alt (jump), Triangle left Shift (change weapon, with Cross the ninja rope), Start Enter, Circle/Select Escape

[data]
shipped=Liero 1.33, the author's own archive
