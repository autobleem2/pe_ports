// The console's own pad as the console's pad output (psc-kernel / psc): ten buttons in Sony's order, the d-pad on
// axes 0 and 1 (arrow keys). Left/right turn, up/down walk.
//   JOY1 Triangle  JOY2 Circle  JOY3 Cross  JOY4 Square  JOY5 L2  JOY6 R2  JOY7 L1  JOY8 R1  JOY9 Select  JOY10 Start
bind JOY1 "+scores"
bind JOY2 "+button2"
bind JOY3 "+moveup"
bind JOY4 "+movedown"
bind JOY5 "+lookup"
bind JOY6 "+attack"
bind JOY7 "weapprev"
bind JOY8 "weapnext"
bind JOY9 "+lookdown"
bind JOY10 "togglemenu"
