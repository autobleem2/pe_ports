// ioquake3 on the PlayStation Classic: the settings every run starts with (psc-pad.sh puts this first in
// .q3a/baseoa/psc_pad.cfg, then the pad's bindings). The window (r_mode, size, full screen) and the pad's own
// switch (in_joystick) are given on the command line: they only take effect at start-up.

// the pad: plain joystick keys, the left stick and d-pad as arrow keys, as the menus expect
seta in_joystickUseAnalog "0"
seta joy_threshold "0.5"

// the picture: light enough for the console's GPU through gl4es
seta r_picmip "1"
seta r_texturebits "16"
seta r_vertexLight "0"
seta r_simpleMipMaps "1"
seta r_lodbias "1"
seta r_subdivisions "8"
seta r_flares "0"
seta r_drawSun "0"
seta r_dynamiclight "1"
seta r_ext_compressed_textures "0"
seta r_ignoreGLErrors "1"
seta r_swapInterval "0"
seta cg_shadows "1"
seta cg_marks "1"
seta com_maxfps "60"

// the sound: the engine's own SDL mixer (no OpenAL in this build)
seta s_useOpenAL "0"
seta s_volume "0.8"
seta s_musicvolume "0.7"

// the game: no network chatter, no voice chat, runs by default
seta cl_run "1"
seta cl_voip "0"
seta cl_allowDownload "0"
seta com_introplayed "1"
seta cg_drawFPS "0"
seta name "PSC player"

// every pad key starts unbound; the pad file that follows sets the ones it uses
unbind JOY1
unbind JOY2
unbind JOY3
unbind JOY4
unbind JOY5
unbind JOY6
unbind JOY7
unbind JOY8
unbind JOY9
unbind JOY10
unbind JOY11
unbind JOY12
unbind JOY13
unbind JOY14
unbind JOY15
unbind JOY16
unbind JOY17
unbind JOY18
unbind JOY19
unbind JOY20
unbind JOY21
unbind JOY22
unbind JOY23
unbind JOY24
unbind JOY25
unbind JOY26
unbind JOY27
unbind JOY28
unbind JOY29
unbind JOY30
unbind JOY31
unbind JOY32
bind UPARROW "+forward"
bind DOWNARROW "+back"
bind LEFTARROW "+left"
bind RIGHTARROW "+right"
