// An Xbox 360 layout pad with two sticks (any pad but the console's own): the left stick walks and strafes
// (arrow keys), the right stick turns and looks, the d-pad also walks (it moves the left stick too).
//   JOY1 A  JOY2 B  JOY3 X  JOY4 Y  JOY5 LB  JOY6 RB  JOY7 Back  JOY8 Start  JOY9 Guide  JOY10 left stick click
//   JOY18 left trigger  JOY24 right trigger (axes 2 and 5)
//   JOY19 / JOY20 right stick left / right  JOY21 / JOY22 right stick up / down (axes 3 and 4)
bind LEFTARROW "+moveleft"
bind RIGHTARROW "+moveright"
bind JOY1 "+moveup"
bind JOY2 "+button2"
bind JOY3 "+movedown"
bind JOY4 "+zoom"
bind JOY5 "weapprev"
bind JOY6 "weapnext"
bind JOY7 "+scores"
bind JOY8 "togglemenu"
bind JOY10 "centerview"
bind JOY18 "+moveup"
bind JOY19 "+left"
bind JOY20 "+right"
bind JOY21 "+lookup"
bind JOY22 "+lookdown"
bind JOY24 "+attack"
