// An Xbox 360 layout pad (AutoBleem's x360 pad output) read as the console's own pad: the d-pad is the left stick
// (arrow keys), there is no right stick. Left/right turn, up/down walk.
//   JOY1 A  JOY2 B  JOY3 X  JOY4 Y  JOY5 LB  JOY6 RB  JOY7 Back  JOY8 Start  JOY9 Guide  JOY10 left stick click
//   JOY18 left trigger  JOY24 right trigger (axes 2 and 5)
bind JOY1 "+moveup"
bind JOY2 "+button2"
bind JOY3 "+movedown"
bind JOY4 "+scores"
bind JOY5 "weapprev"
bind JOY6 "weapnext"
bind JOY7 "+lookdown"
bind JOY8 "togglemenu"
bind JOY18 "+lookup"
bind JOY24 "+attack"
