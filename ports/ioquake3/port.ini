; ioquake3 for the PlayStation Classic, as a PE package. The generator is tools/mkmod.py (README.md, "port.ini").
[port]
id=ioquake3
name=ioquake3 (OpenArena)
version=1.36-4
category=games
requires=openarenadata
uses=q3-openarena
description=ioquake3 is the Quake III Arena engine, set up here to play OpenArena, the free first-person shooter made for it. It needs the OpenArena data package (game data: the Packages row); the launcher asks which data to use. Quake III Arena's own files are not part of this package.
licence=GPL-2.0-or-later
licence_files=COPYING-gl4es COPYING.txt id-readme.txt md4-readme.txt voip-readme.txt code/jpeg-8c/README
upstream_url=https://github.com/ioquake/ioq3
upstream_commit=f2c61c14c4ee3d79907cdac5251706c2f96a4901
upstream_note=11 February 2020 (the 1.36 line), the commit the 2020 port was made from
icon_text=IOQUAKE3|OPENARENA
publisher=ioquake3 contributors, id Software
year=2005
copyright=Copyright (C) 1999-2005 Id Software, Inc.; Copyright (C) 2005-2020 Id Software LLC and the ioquake3 contributors (the other files carry their own notices in the source); built-in libraries with their own licences: zlib, libjpeg (Independent JPEG Group), libogg, libvorbis, opus and opusfile (BSD-style, Xiph.Org); SDL2 (zlib licence) is the console's own, shared
changes=ports/ioquake3/files/psc-pad.sh: the engine's fs_basepath is the package the launcher's "Choose game data" picked (AB_PKG_DIR; without a pick, a launcher that has no game packages, the neighbouring OpenArena data App); ports/ioquake3/patches/0001-gl-functions-from-sdl-video-gl-driver.patch: the renderer takes its OpenGL functions from the library named by SDL_VIDEO_GL_DRIVER (gl4es) before asking SDL for them (SDL asks that library first only for EGL 1.4 and older); ports/ioquake3/patches/0002-joystick-raw-option.patch: the new setting in_joystickGamepad (default 1, the engine's own behaviour); with 0 the engine reads the pad as a plain joystick (JOY1..JOY10, the axes as arrows) even when SDL has a game controller mapping for it, as the console pad's key bindings and the OpenArena menus expect (the package sets 0; the 2020 port hid the pad from SDL with an SDL_GAMECONTROLLER_IGNORE_DEVICES hint instead, which made SDL 2.0.18 list no joystick at all); the 2020 port's one change, which skipped the Quake III Arena CD key check, is not made: this package does not run Quake III Arena's own data; ports/ioquake3/files: the pad's key bindings for the console (psc-pad.sh picks them), the 1280x720 full-screen settings and the start-up settings; gl4es 1.1.6 (MIT licence, gl4es-1.1.6.tar.gz, sha256 dca1d897e492a0cb163a3390f273fbd4cc7ab2367d236d93dc2b321ce108ed5c, fetched at build time from autobleem.retromenele.pl/deps/gl4es/ with github.com/ptitSeb/gl4es as the fallback) is built for the console and shipped as lib/libGL.so.1: the console has OpenGL ES only and the OpenGL 1 renderer needs OpenGL 1.1; the renderer is the default (+set cl_renderer opengl1) and the window takes the output's own size (r_mode -2); built with OpenAL, cURL, VoIP and Mumble off, the built-in zlib, libjpeg, libogg, libvorbis, opus and opusfile, ARM hard-float, and the ARMv7 QVM compiler (ARCH=armv7l) for the game's virtual machine

[launcher]
filename=ioquake3
binary=ioquake3.armv7l
pre=. ./psc-pad.sh
args=+set com_basegame baseoa +set fs_basepath "${OA_DATA}" +set cl_renderer opengl1 +set in_joystickGamepad 0 +set in_joystick 1 +set in_joystickNo 0 +set r_mode -2 +set r_fullscreen 1 +exec psc_pad.cfg
env=HOME=/var/volatile/launchtmp SDL_VIDEO_GL_DRIVER="$(pwd)/lib/libGL.so.1" LD_LIBRARY_PATH="${PROJECT_ERIS_PATH}/lib:${LD_LIBRARY_PATH}"

[pad]
PadMode=psc-kernel
Dpad2Analog=0
Analog2Dpad=1
note=like every port: the console's own pad (psc-kernel, ten buttons, the d-pad and the left stick on axes 0/1; ports/ioquake3/files/psc/pad-psc.cfg, JOY1..JOY10 = Triangle, Circle, Cross, Square, L2, R2, L1, R1, Select, Start). The engine reads the pad as a plain joystick (+set in_joystickGamepad 0, patch 0002: SDL knows the console's two virtual pads as game controllers, and the OpenArena menus only know the JOY keys; the SDL_GAMECONTROLLER_IGNORE_DEVICES hint is not used - SDL 2.0.18 then lists no joystick at all). A player who sets the App's pad mode to x360-kernel in Game settings gets two sticks, two triggers and a hat: psc-pad.sh reads AB_APP_PAD_MODE and then player 1's pad name from the pad daemon's log (abpadd.log) - the console's own pad (no sticks) gets the d-pad bindings (left/right turn, psc/pad-x360-dpad.cfg), any other pad the dual-analog ones (left stick walks and strafes, right stick turns and looks, psc/pad-x360-analog.cfg); no answer = analog. Under psc-kernel there is nothing to choose: every pad is the console's pad.

[data]
shipped=none
shipped_note=none
