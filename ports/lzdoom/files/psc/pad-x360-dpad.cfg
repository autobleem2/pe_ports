// An Xbox 360 layout (x360-kernel) with the console's own pad on it, which has no sticks: the d-pad is hat 1, the
// sticks and triggers are not used.  Joy1 A  Joy2 B  Joy3 X  Joy4 Y  Joy5 LB  Joy6 RB  Joy7 Back  Joy8 Start
bind POV1Left "+left"
bind POV1Right "+right"
bind POV1Up "+forward"
bind POV1Down "+back"
bind Joy1 "+attack"
bind Joy2 "+use"
bind Joy3 "+speed"
bind Joy4 "togglemap"
bind Joy5 "weapprev"
bind Joy6 "weapnext"
bind Joy7 "togglemap"
bind Joy8 "menu_main"
