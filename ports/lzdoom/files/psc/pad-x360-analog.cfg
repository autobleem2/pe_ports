// An Xbox 360 layout (x360-kernel) with any other pad: the left stick walks and strafes, the right stick turns
// (psc-pad.sh sets the axes), the d-pad (hat 1) changes the weapon.
//   Joy1 A  Joy2 B  Joy3 X  Joy4 Y  Joy5 LB  Joy6 RB  Joy7 Back  Joy8 Start
bind POV1Left "weapprev"
bind POV1Right "weapnext"
bind POV1Up "+forward"
bind POV1Down "+back"
bind Joy1 "+attack"
bind Joy2 "+use"
bind Joy3 "+speed"
bind Joy4 "togglemap"
bind Joy5 "+moveleft"
bind Joy6 "+moveright"
bind Joy7 "togglemap"
bind Joy8 "menu_main"
