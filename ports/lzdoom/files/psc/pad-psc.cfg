// The console's own pad as the console's pad output (psc-kernel / psc): ten buttons in Sony's order, the d-pad on
// axes 0 and 1 (psc-pad.sh writes both axes as "no game axis", so the d-pad is four buttons here).
//   Joy1 Triangle  Joy2 Circle  Joy3 Cross  Joy4 Square  Joy5 L2  Joy6 R2  Joy7 L1  Joy8 R1  Joy9 Select  Joy10 Start
// In the menus Cross is OK and Circle is Back (menu_pscpad, the one change to the engine).
bind Axis1Minus "+left"
bind Axis1Plus "+right"
bind Axis2Minus "+forward"
bind Axis2Plus "+back"
bind Joy1 "togglemap"
bind Joy2 "+use"
bind Joy3 "+attack"
bind Joy4 "+speed"
bind Joy5 "+moveleft"
bind Joy6 "+moveright"
bind Joy7 "weapprev"
bind Joy8 "weapnext"
bind Joy9 "togglemap"
bind Joy10 "menu_main"
