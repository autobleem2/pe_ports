// The console's own pad as the console's pad output (psc-kernel / psc), for the console's pad and for any other pad
// (a DualShock 3 ...) the launcher's pad daemon shows to the engine as that pad: ten buttons in Sony's order, the
// d-pad on axes 0 and 1 (psc-pad.sh writes both axes as "no game axis", so the d-pad is four buttons here).
//   Joy1 Triangle  Joy2 Circle  Joy3 Cross  Joy4 Square  Joy5 L2  Joy6 R2  Joy7 L1  Joy8 R1  Joy9 Select  Joy10 Start
// The layout (the test sheet has the same table):
//   d-pad up/down walk, d-pad left/right turn (strafe while Circle is held)
//   Cross  fire (OK in the menus: menu_pscpad)      R2  fire
//   Square use / open doors                          L2  run (hold)
//   Circle strafe (hold, with the d-pad)             L1/R1  previous / next weapon
//   Triangle automap                                 Select  always run on/off     Start  the menu
// In the menus Cross is OK, Circle is Back and Triangle is Clear (menu_pscpad, the one change to the engine).
bind Axis1Minus "+left"
bind Axis1Plus "+right"
bind Axis2Minus "+forward"
bind Axis2Plus "+back"
bind Joy1 "togglemap"
bind Joy2 "+strafe"
bind Joy3 "+attack"
bind Joy4 "+use"
bind Joy5 "+speed"
bind Joy6 "+attack"
bind Joy7 "weapprev"
bind Joy8 "weapnext"
bind Joy9 "toggle cl_run"
bind Joy10 "menu_main"
