// LZDoom on the PlayStation Classic: the settings every run starts with (psc-pad.sh puts this first in psc_pad.cfg,
// then the pad's bindings). The window size and full screen are set on the command line and in the ini file.

// the picture: light enough for the console
set vid_maxfps 60

// the sound: OPL music (needs no sound font), sound effects through OpenAL Soft
set snd_mididevice -3
set snd_musicvolume 0.6
set snd_sfxvolume 0.8

// the pad: the engine ignores every joystick until use_joystick is on (a fresh lzdoom.ini has it off and
// nothing else sets it); no mouse, so no free look
set use_joystick true
set freelook false

// the pad's keys start empty, so a layout never inherits the keys of another one run before. `bind <key> ""`, not
// `unbind <key>`: while the engine starts, a bind runs at once but an unbind is held back until the start-up is over
// (c_dispatch.cpp C_DoCommand), so an unbind here would wipe the bindings the pad file makes after it
bind Joy1 ""
bind Joy2 ""
bind Joy3 ""
bind Joy4 ""
bind Joy5 ""
bind Joy6 ""
bind Joy7 ""
bind Joy8 ""
bind Joy9 ""
bind Joy10 ""
bind Axis1Plus ""
bind Axis1Minus ""
bind Axis2Plus ""
bind Axis2Minus ""
bind POV1Up ""
bind POV1Down ""
bind POV1Left ""
bind POV1Right ""
