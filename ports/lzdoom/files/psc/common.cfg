// LZDoom on the PlayStation Classic: the settings every run starts with (psc-pad.sh puts this first in psc_pad.cfg,
// then the pad's bindings). The window size and full screen are set on the command line and in the ini file.

// the picture: light enough for the console
set vid_maxfps 60

// the sound: OPL music (needs no sound font), sound effects through OpenAL Soft
set snd_mididevice -3
set snd_musicvolume 0.6
set snd_sfxvolume 0.8

// the pad: no mouse, so no free look
set freelook false

// the pad's keys start empty, so a layout never inherits the keys of another one run before
unbind Joy1
unbind Joy2
unbind Joy3
unbind Joy4
unbind Joy5
unbind Joy6
unbind Joy7
unbind Joy8
unbind Joy9
unbind Joy10
unbind Axis1Plus
unbind Axis1Minus
unbind Axis2Plus
unbind Axis2Minus
unbind POV1Up
unbind POV1Down
unbind POV1Left
unbind POV1Right
