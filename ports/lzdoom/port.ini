; LZDoom for the PlayStation Classic, as a PE package. The generator is tools/mkmod.py (README.md, "port.ini").
[port]
id=lzdoom
name=LZDoom (Freedoom)
version=3.84-5
category=games
requires=freedoomdata
uses=doom-iwad
package_dir=WAD
description=LZDoom is a Doom source port for older hardware, set up here to play Freedoom, the free Doom-compatible game. It needs game data: the Freedoom data package (Packages row), or a Doom WAD you own - put it in the Packages folder or in this App's WAD folder, and the launcher lets you choose which game to play. Doom's own game files are not part of this package. Other WADs and mods go in its MODS folder.
licence=GPL-3.0-only
licence_files=COPYING-openal-soft docs/licenses/README.TXT docs/licenses/gpl.txt docs/licenses/lgpl.txt docs/licenses/bsd.txt docs/licenses/bzip2.txt docs/licenses/dumb.txt docs/licenses/gdtoa.txt docs/licenses/fxaa.txt
upstream_url=https://github.com/drfrag666/lzdoom
upstream_commit=bdcb9fcbcda7cd79b6012537b63f5972118d5c8c
upstream_note=tag 3.84 of 16 December 2019, the version the 2020 port was made from
icon_text=LZDOOM|FREEDOOM
publisher=Christoph Oelckers, Rachael Alexanderson, drfrag and the (G/L)ZDoom contributors; id Software
year=1993
copyright=Copyright (c) 1993-1996 id Software, Inc.; Copyright (c) 1998-2020 Randy Heit, Christoph Oelckers, Rachael Alexanderson, drfrag and the ZDoom, GZDoom and LZDoom contributors (the source files carry their own notices); the project's licence texts are in licences/ (docs/licenses/README.TXT says which part is under which: GPL v3, LGPL v3 for the OpenGL renderer, BSD-like for most original code); built-in libraries with their own licences: game-music-emu (LGPL), DUMB, zlib, bzip2, libjpeg, lzma, gdtoa, asmjit, libADLMIDI and libOPNMIDI; OpenAL Soft (LGPL v2) is shipped as a separate library, see licences/
changes=ports/lzdoom/patches/0001-menu-psc-pad.patch: the menus take the console pad's Cross as OK and Circle as Back when the new setting menu_pscpad is on (the 2020 port had no menu for its pad at all); ports/lzdoom/patches/0002-sdl-joystick-in-menus.patch: the SDL joystick buttons reach the menus (the engine threw them away while a menu was open) and the d-pad's axes mean the right directions there (left and right were swapped with up and down); both from LZDoom's own fix of 27 August 2020 (commit fd4d600694, after 3.84), without its other changes; ports/lzdoom/files/alsoft.conf: OpenAL Soft is set to 16-bit samples at 44100 Hz (ALSOFT_CONF in port.ini), the only sample type the console's ALSA device takes; ports/lzdoom/files/psc-pad.sh: the game file is the one the launcher's "Choose game data" picked (AB_PKG_FILE) - Freedoom from a package or a WAD of the App's own WAD folder (port.ini package_dir=, uses=doom-iwad); without a pick (a launcher that has no game packages) the old search of the WAD folder and the neighbouring Freedoom data App runs; ports/lzdoom/files: the pad's key bindings and axis settings for the console (psc-pad.sh picks them; the old bindings are cleared with bind <key> "" because the engine holds every unbind back until its start-up is over, after the new bindings) and use_joystick switched on (the engine's own default leaves every pad dead) and the start-up settings (640x360 full screen); built without OpenMP, GTK and FluidSynth, with the built-in zlib, and with the software renderer shown through SDL's own renderer as the default (the OpenGL renderer is compiled in; vid_renderer 1 selects it); OpenAL Soft 1.19.1 (openal-soft-1.19.1.tar.bz2, sha256 5c2f87ff5188b95e0dc4769719a9d89ce435b8322b4478b95dd4b427fe84b2e9, fetched at build time from autobleem.retromenele.pl/deps/openal/ with openal-soft.org as the fallback) is built for the console and shipped as lib/libopenal.so.1

[launcher]
filename=lzdoom
binary=lzdoom
pre=. ./psc-pad.sh
args=-iwad "${LZ_IWAD}" ${LZ_MODS} -config lzdoom.ini -savedir saves -width 640 -height 360 -exec psc_pad.cfg +set menu_pscpad ${LZ_MENUPAD}
env=HOME=/var/volatile/launchtmp ALSOFT_CONF="$(pwd)/alsoft.conf" LD_LIBRARY_PATH="${PROJECT_ERIS_PATH}/lib:${LD_LIBRARY_PATH}:/var/volatile/launchtmp/lib"

[pad]
PadMode=psc-kernel
Dpad2Analog=0
Analog2Dpad=1
note=like every port: the console's own pad (psc-kernel). lzdoom reads it as a plain SDL joystick: buttons 0..9 = Joy1..Joy10 (Triangle, Circle, Cross, Square, L2, R2, L1, R1, Select, Start), axes 0/1 = the d-pad. psc-pad.sh writes the pad's axis map into the engine's ini (d-pad left/right turn, up/down walk) and ports/lzdoom/files/psc/*.cfg bind the buttons. With the pad mode x360-kernel (Game settings) it picks d-pad or dual-analog bindings from player 1's pad name in the pad daemon's log, as ports/ioquake3 does.

[data]
shipped=none
shipped_note=none
