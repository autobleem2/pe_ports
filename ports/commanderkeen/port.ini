; Commander Genius for the PlayStation Classic, as a PE package. The generator is tools/mkmod.py (README.md, "port.ini").
[port]
id=commanderkeen
name=Commander Genius (Keen 1)
version=2.4.0-5
description=Commander Genius is an open-source engine that plays Commander Keen: Invasion of the Vorticons and the Galaxy series. The package carries the first Keen episode (Invasion of the Vorticons: Marooned on Mars, the Apogee shareware release); the other episodes go in .CommanderGenius/games.
licence=GPL-2.0
category=games
licence_files=COPYRIGHT GsKit/LICENSE hqp/Readme_hqp.txt
upstream_url=https://github.com/gerstrong/Commander-Genius
upstream_commit=e0d32e28e0b368d98e70e5013e641de2e9ef74d7
upstream_note=21 March 2020, the commit the 2020 port was made from (its only change over it was the packaging)
icon_text=COMMANDER|GENIUS|KEEN 1
publisher=Gerstrong and contributors
year=1990
copyright=Copyright (c) 2008-2020 Gerstrong (Gerhard Stein) and the Commander Genius contributors; GsKit is under the same licence; the high quality pack (music, sounds) by tulip, see licences/Readme_hqp.txt
changes=patches/0001-cast-align-is-a-warning.patch: cast-align stays a warning (the Boost headers trip it on ARM); built with the SDL2 renderer (USE_OPENGL=No, no downloader) and upstream's TrueType text (SDL2_ttf); ports/commanderkeen/files: the pad bindings and the 1280x720 full-screen settings; built with the Boost 1.74.0 headers (header-only, Boost Software License 1.0), fetched at build time from our site's mirror (https://autobleem.retromenele.pl/deps/boost/boost_1_74_0.tar.bz2), the upstream address https://archives.boost.io/release/1.74.0/source/boost_1_74_0.tar.bz2 being the fallback (sha256 83bfc1507731a0906e387fc28b7ef5417d591429e51e788417fe9ff025e116b1)

[launcher]
filename=commanderkeen
binary=CGeniusExe
args=
env=HOME=/var/volatile/launchtmp

[pad]
PadMode=psc-kernel
Dpad2Analog=0
Analog2Dpad=1
note=Commander Genius reads SDL joystick axes 0/1 and buttons of the console pad (ports/commanderkeen/files/cgenius.cfg, [input0]): B2 Cross = jump and confirm, B1 Circle = pogo, B3 Square = fire, B0 Triangle = run, B6/B7 L1/R1 = status/camera, B8 Select = help, B9 Start = the menu; axes 0/1 (the d-pad, the stick past half travel) steer

[data]
shipped=Keen 1 shareware (games/Keen 1/keen1, with VENDOR.DOC)
shipped_note=.CommanderGenius/games/Keen 1/keen1 is the shareware release of Commander Keen 1 (Apogee / id Software) as released, with VENDOR.DOC; it stays theirs and may be spread only complete and unmodified. Keen 4 and any saved game are not included.
