# DOSBox's base settings on the PlayStation Classic. psc-dosbox.sh copies this file to the run's folder and appends
# the chosen game's settings (cpu cycles, memory, sound), the mapper file's absolute path and the [autoexec] lines.
# output=texture and fullresolution=desktop (2026-10-07, the PSC round): this SDL2 build has no "overlay" (the picture
# stayed black) and a fixed 1280x720 fullscreen gave nothing on the CRT 480p output - the desktop size fits every mode.
[sdl]
fullscreen=true
fulldouble=false
fullresolution=desktop
windowresolution=1280x720
output=texture
autolock=true
sensitivity=100
waitonerror=true
priority=higher,normal
usescancodes=true

[dosbox]
machine=svga_s3
captures=capture
memsize=32

[render]
frameskip=0
aspect=forced
scaler=normal3x

[cpu]
core=dynamic
cputype=auto
cycles=auto
cycleup=500
cycledown=500

[mixer]
nosound=false
rate=22050
blocksize=2048
prebuffer=40

[midi]
mpu401=intelligent
mididevice=default

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
sbmixer=true
oplmode=auto
oplemu=default
oplrate=22050

[gus]
gus=false

[speaker]
pcspeaker=true
pcrate=22050
tandy=auto
tandyrate=22050
disney=true

[joystick]
joysticktype=auto
timed=true
autofire=false
swap34=false
buttonwrap=true

[serial]
serial1=dummy
serial2=dummy
serial3=disabled
serial4=disabled

[dos]
xms=true
ems=true
umb=true
keyboardlayout=none
