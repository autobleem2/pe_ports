; DOSBox for the PlayStation Classic, as a PE package: the engine of the DOS game packages (packages spec, section 10).
; The generator is tools/mkmod.py (README.md, "port.ini").
[port]
id=dosbox
name=DOSBox
version=0.74-4
icon_file=files/icon.png
description=DOSBox plays DOS games. It is the engine for the DOS game packages (kind dos-game: the Store's Liero and Xargon, or a game folder you add yourself): start it, pick a game, then Game or Setup. The game's files are mounted as drive C: and its saves stay in its own folder.
licence=GPL-2.0-or-later
licence_files=COPYING AUTHORS THANKS
upstream_url=https://gitlab.com/modmyclassic/ports/dosbox
upstream_commit=cfb01463c824083908be9f1b606d8901c8de07be
upstream_note=DOSBox 0.74 with the SDL2 port the 2020 package was made from; its classic/ folder (the 2020 packaging), the Android project and the Visual C project are left out of the build and the source archive
export_exclude=classic android-project visualc_net .gitlab-ci.yml
icon_text=DOS|BOX
publisher=Team DOSBox
year=2002
category=emulators
uses=dos-game
copyright=Copyright (c) 2002-2013 The DOSBox Team (the names are in AUTHORS and THANKS)
changes=built with SDL2, no OpenGL and the ARM dynamic recompiler (what upstream's own configure was asked for, --disable-opengl --with-sdl2, with C_DYNREC on): ports/dosbox/files/sources.txt and config.h are what that configure compiled and made (ports/dosbox/regen.sh makes them again) and ports/dosbox/files/Makefile.psc compiles them without automake; libpng and zlib are linked statically; ports/dosbox/files/psc-dosbox.sh is the start script (mounts the chosen game package as drive C: read-write, takes its start programs and DOSBox settings from the launcher, offers Game or Setup, writes the run's configuration and uses the mapper file by its absolute path); ports/dosbox/files/dosbox.conf and mapper.txt are our base settings and default pad map

[launcher]
filename=dosbox
binary=dosbox
pre=. ./psc-dosbox.sh
args=-conf "${DB_CONF}" -fullscreen
env=HOME=/var/volatile/launchtmp

[pad]
PadMode=psc-kernel
Dpad2Analog=0
Analog2Dpad=1
note=DOSBox's own mapper turns the console pad's SDL joystick buttons and axes 0/1 into DOS keys (files/mapper.txt is the default, a game package may bring its own): d-pad arrows, Cross/Square/Start Enter, Circle/Select Escape, Triangle right Shift, L1 left Ctrl, R1 Space; no dependency on the pad's keyboard mode

[data]
shipped=none
